<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00aa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Tank body -->
  <rect x="20" y="35" width="50" height="30" rx="3" fill="url(#tankGrad)"/>
  <!-- Tracks -->
  <rect x="15" y="30" width="8" height="40" rx="2" fill="#0a0e17"/>
  <rect x="67" y="30" width="8" height="40" rx="2" fill="#0a0e17"/>
  <!-- Turret base -->
  <circle cx="45" cy="50" r="12" fill="url(#tankGrad)"/>
  <!-- Barrel -->
  <rect x="50" y="46" width="35" height="8" rx="2" fill="url(#tankGrad)"/>
</svg>

