# Render Blueprint - Space Battles
# Deploy both frontend and backend with one click

services:
  # Backend API Server
  - type: web
    name: space-battles-server
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        generateValue: true  # Render will generate a random secure key
      - key: ALLOWED_ORIGINS
        fromService:
          name: space-battles-client
          type: web
          property: url
    healthCheckPath: /health

  # Frontend Static Site
  - type: web
    name: space-battles-client
    runtime: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: space-battles-server
          type: web
          property: url

