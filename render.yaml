# Render Blueprint - Space Battles
# Deploys the backend server
# Frontend: Add manually as Static Site in Render Dashboard

services:
  - type: web
    name: space-battles-server
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build:client
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health

